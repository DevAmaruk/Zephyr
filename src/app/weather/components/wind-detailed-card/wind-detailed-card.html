<article class="wind-container">
  <section class="icon">
    @if (icon) {
      <img [src]="icon" alt="wind icon" />
    }
  </section>
  <section class="symbol">
    @if (symbol) {
      <p class="symbol">{{ symbol }}</p>
    }
  </section>
  <section class="value-unit">
    @if (value) {
      <p class="value">{{ value }}</p>
    }
    @if (unit) {
      <span>{{ unit }}</span>
    }
  </section>
</article>
