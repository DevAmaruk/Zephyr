<article class="weather-container" (click)="onCardTapped()">
  <header>
    <h2>{{ cityName }}</h2>
  </header>

  <section class="weather-data">
    <p>
      <span class="temperature">{{ currentTemperature }}</span>
      <span class="unit-temperature">{{ temperatureUnit | temperatureUnitConversion }}</span>
    </p>
    <p>
      <span class="feels-like">{{ feelsLikeTemperature }}</span>
      <span class="unit-feels-like">{{ temperatureUnit | temperatureUnitConversion }}</span>
    </p>
    <p>
      <span class="weather-code">{{ weatherCode | weatherCodeConversion: currentLanguage }}</span>
    </p>
  </section>
  @if (!isCitySaved) {
    <button (click)="onSaveCity(); $event.stopPropagation()" type="button" aria-label="Save city">
      <img ngSrc="icons/save-button-icon.svg" width="32" height="32" alt="save-button-icon" />
    </button>
  } @else {
    <button (click)="onSaveCity(); $event.stopPropagation()" type="button" aria-label="Unsave city">
      <img ngSrc="icons/save-button-filled.svg" width="32" height="32" alt="unsave-button-icon" />
    </button>
  }
</article>
