<header>
  <h1>Zephyr</h1>
</header>

<main>
  <section class="weather-card-section">
    @if (weatherData$ | async; as weatherData) {
      <app-weather-card
        [cityName]="currentCity?.name"
        [currentTemperature]="weatherData.current.temperature_2m"
        [feelsLikeTemperature]="weatherData.current.apparent_temperature"
        [weatherCode]="weatherData.current.weather_code"
        [temperatureUnit]="settings.temperatureUnit"
        [currentLanguage]="settings.language"
        (saveCityButton)="onSaveCity()"
        (cardTapped)="onCardTapped()"
        [isCitySaved]="isCitySaved"
        [cityJustSaved]="cityJustSaved"
      />
    } @else {
      <p>Bienvenue sur Zephyr !</p>
      <p>Une application météo qui se veut simple mais élégante.</p>
      <p>
        Pour commencer, recherchez une ville en cliquant sur le bouton de recherche en bas à droite.
      </p>
    }
  </section>
</main>

<button class="fab-search" (click)="onSearchCity()">
  <img ngSrc="icons/search-button-icon.svg" width="32" height="32" alt="search button" />
</button>
<button (click)="onSavedCitiesList()">Villes Sauvegardées</button>

<footer>
  <button (click)="onSettings()" class="settings-button">
    <img ngSrc="icons/settings-icon.svg" width="32" height="32" alt="settings button" />
    <span class="settings-text">Paramètres</span>
  </button>

  <p class="open-meteo">powered by Open-Meteo API</p>
</footer>
