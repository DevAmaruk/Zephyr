<header>
  <img src="icons/back_button_icon.svg" alt="back button" (click)="backToHomepage()" />
  <h2>Villes sauvegardées</h2>
</header>

<main>
  @for (city of savedCitiesList; track city.name) {
    <div class="card-wrapper">
      <div class="swipe-container">
        <app-delete-city-card />
        <app-city-card
          [cityName]="city.name"
          [countryCode]="city.country_code"
          (cardTapped)="onSelectCity(city)"
          [translateX]="swipedCityID === city.id ? currentTranslateX : 0"
          (touchstart)="onTouchStart($event, city.id)"
          (touchmove)="onTouchMove($event)"
          (touchend)="onTouchEnd($event, city)"
        />
      </div>
    </div>
  }
</main>
