<header>
  <h1>Paramètres</h1>
  <button (click)="onBackToHomepage()">Retour page principale</button>
</header>

<main>
  <div>
    <h2>Langue</h2>
    <input type="radio" name="language" value="fr" (change)="onLanguageChange('fr')" />
    <label for="fr">Français</label>
    <input type="radio" name="language" value="en" (change)="onLanguageChange('en')" />
    <label for="en">Anglais</label>
  </div>

  <div>
    <h2>Apparence</h2>
    <input type="radio" name="theme" value="system" (change)="onThemeChange('system')" />
    <label for="system">Système</label>
    <input type="radio" name="theme" value="light" (change)="onThemeChange('light')" />
    <label for="light">Clair</label>
    <input type="radio" name="theme" value="dark" (change)="onThemeChange('dark')" />
    <label for="dark">Sombre</label>
  </div>

  <div>
    <h2>Unité de température</h2>
    <input
      type="radio"
      name="temperatureUnit"
      value="celsius"
      (change)="onTemperatureUnitChange('celsius')"
    />
    <label for="celsius">Celsius</label>
    <input
      type="radio"
      name="temperatureUnit"
      value="fahrenheit"
      (change)="onTemperatureUnitChange('fahrenheit')"
    />
    <label for="fahrenheit">Fahrenheit</label>
  </div>

  <div>
    <h2>Unité de vitesse du vent</h2>
    <input type="radio" name="windUnit" value="kmh" (change)="onWindUnitChange('kmh')" />
    <label for="kmh">km/h</label>
    <input type="radio" name="windUnit" value="mph" (change)="onWindUnitChange('mph')" />
    <label for="mph">mph</label>
    <input type="radio" name="windUnit" value="ms" (change)="onWindUnitChange('ms')" />
    <label for="m/s">m/s</label>
    <input type="radio" name="windUnit" value="kn" (change)="onWindUnitChange('kn')" />
    <label for="knots">knots</label>
  </div>

  <div>
    <h2>Unité de précipitation</h2>
    <input
      type="radio"
      name="precipitationUnit"
      value="mm"
      (change)="onPrecipitationUnitChange('mm')"
    />
    <label for="mm">mm</label>
    <input
      type="radio"
      name="precipitationUnit"
      value="inches"
      (change)="onPrecipitationUnitChange('inch')"
    />
    <label for="inches">inches</label>
  </div>

  <div>
    <button (click)="onSaveSettings()">Sauvgarder</button>
  </div>
</main>
