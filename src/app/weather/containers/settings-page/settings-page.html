<header>
  <img src="icons/back_button_icon.svg" alt="back button" (click)="onBackToHomepage()" />
  <h2>Paramètres</h2>
  <div></div>
</header>

<main>
  <p class="section-label">Langue</p>
  <section class="card">
    <label class="option">
      <input type="radio" name="language" value="fr" (change)="onLanguageChange('fr')" />
      Français
    </label>
    <label class="option">
      <input type="radio" name="language" value="en" (change)="onLanguageChange('en')" />
      Anglais
    </label>
  </section>

  <p class="section-label">Apparence</p>
  <section class="card">
    <label class="option">
      <input type="radio" name="theme" value="system" (change)="onThemeChange('system')" />
      Système
    </label>
    <label class="option">
      <input type="radio" name="theme" value="light" (change)="onThemeChange('light')" />
      Clair
    </label>
    <label class="option">
      <input type="radio" name="theme" value="dark" (change)="onThemeChange('dark')" />
      Sombre
    </label>
  </section>

  <p class="section-label">Température</p>
  <section class="card">
    <label class="option">
      <input
        type="radio"
        name="temperatureUnit"
        value="celsius"
        (change)="onTemperatureUnitChange('celsius')"
      />
      Celsius °C
    </label>
    <label class="option">
      <input
        type="radio"
        name="temperatureUnit"
        value="fahrenheit"
        (change)="onTemperatureUnitChange('fahrenheit')"
      />
      Fahrenheit °F
    </label>
  </section>

  <p class="section-label">Vitesse du vent</p>
  <section class="card wind-grid">
    <label class="option">
      <input type="radio" name="windUnit" value="kmh" (change)="onWindUnitChange('kmh')" />
      km/h
    </label>
    <label class="option">
      <input type="radio" name="windUnit" value="mph" (change)="onWindUnitChange('mph')" />
      mph
    </label>
    <label class="option">
      <input type="radio" name="windUnit" value="ms" (change)="onWindUnitChange('ms')" />
      m/s
    </label>
    <label class="option">
      <input type="radio" name="windUnit" value="kn" (change)="onWindUnitChange('kn')" />
      knots
    </label>
  </section>

  <p class="section-label">Précipitation</p>
  <section class="card">
    <label class="option">
      <input
        type="radio"
        name="precipitationUnit"
        value="mm"
        (change)="onPrecipitationUnitChange('mm')"
      />
      Millimètres (mm)
    </label>
    <label class="option">
      <input
        type="radio"
        name="precipitationUnit"
        value="inch"
        (change)="onPrecipitationUnitChange('inch')"
      />
      Pouces (in)
    </label>
  </section>
</main>

<footer class="save-area">
  <button type="button" class="save-btn" (click)="onSaveSettings()">
    Sauvegarder les paramètres
  </button>
</footer>
